<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Francisco</title>
  <style>
    :root {
      --fondo: #f7f6f2;
      --texto: #1d1f23;
      --suave: #5b6068;
      --linea: #d9d7cf;
      --acento: #1f5fbf;
      --tarjeta: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #14161a;
        --texto: #eceae4;
        --suave: #9aa0a9;
        --linea: #2c3038;
        --acento: #7db0ff;
        --tarjeta: #1b1e24;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 4rem 1.25rem 5rem;
    }
    h1 {
      font-size: 2.4rem;
      line-height: 1.15;
      margin: 0 0 0.5rem;
    }
    .subtitulo {
      color: var(--suave);
      font-size: 1.1rem;
      margin: 0 0 2.5rem;
    }
    h2 {
      font-size: 1.3rem;
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--linea);
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      background: var(--tarjeta);
      border: 1px solid var(--linea);
      border-radius: 6px;
      margin-bottom: 0.75rem;
    }
    li a {
      display: block;
      padding: 0.9rem 1rem;
      color: inherit;
      text-decoration: none;
    }
    li a:hover, li a:focus-visible { background: color-mix(in srgb, var(--acento) 8%, transparent); }
    li a:focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }
    .nombre {
      display: block;
      font-weight: bold;
      color: var(--acento);
    }
    .detalle {
      display: block;
      color: var(--suave);
      font-size: 0.95rem;
    }
    p a { color: var(--acento); }
  </style>
</head>
<body>
  <main>
    <h1>Francisco</h1>
    <p class="subtitulo">Estudiante de Ciencias de la Computación.</p>

    <h2>Proyectos</h2>
    <ul>
      <!-- Para agregar otro proyecto, copia un bloque <li>...</li> y cambia el nombre del archivo en el link. -->
      <li>
        <a href="https://github.com/fcofu/My_practices/blob/main/practica.py" target="_blank" rel="noopener noreferrer">
          <span class="nombre">practica.py</span>
          <span class="detalle">Script de Python</span>
        </a>
      </li>
      <li>
        <a href="https://github.com/fcofu/My_practices/blob/main/preubas.py" target="_blank" rel="noopener noreferrer">
          <span class="nombre">preubas.py</span>
          <span class="detalle">Script de Python</span>
        </a>
      </li>
      <li>
        <a href="https://github.com/fcofu/My_practices/blob/main/pruebasgrok.py" target="_blank" rel="noopener noreferrer">
          <span class="nombre">pruebasgrok.py</span>
          <span class="detalle">Script de Python</span>
        </a>
      </li>
      <li>
        <a href="https://github.com/fcofu/My_practices/blob/main/test3.py" target="_blank" rel="noopener noreferrer">
          <span class="nombre">test3.py</span>
          <span class="detalle">Script de Python</span>
        </a>
      </li>
    </ul>

    <h2>Más</h2>
    <p>
      <a href="https://github.com/fcofu/My_practices" target="_blank" rel="noopener noreferrer">Ver el repositorio completo en GitHub</a>
    </p>
  </main>
</body>
</html>
